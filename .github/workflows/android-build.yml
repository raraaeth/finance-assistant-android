name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/financeassistant-upload.jks

      # ==========================================
      # BUILD SIGNED RELEASE AAB
      # ==========================================

      - name: Build Signed Release AAB
        env:
          KEYSTORE_FILE: financeassistant-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # ==========================================
      # BUILD SIGNED RELEASE APK
      # ==========================================

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: financeassistant-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # ==========================================
      # UPLOAD SIGNED AAB
      # ==========================================

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: finance-assistant-aab-signed
          path: app/build/outputs/bundle/release/*.aab

      # ==========================================
      # UPLOAD SIGNED APK
      # ==========================================

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-assistant-apk-signed
          path: app/build/outputs/apk/release/*.apk
